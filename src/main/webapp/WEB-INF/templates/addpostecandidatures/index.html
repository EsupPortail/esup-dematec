<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <meta charset="UTF-8" />
  <title>Ajouter une candidature</title>
</head>
<body>
  <div layout:fragment="body">
    <h2>Ajouter une nouvelle candidature</h2>
  <div th:replace="~{fragments/help :: accordion(content=~{::.help-content})}">
      <div class="help-content">
<p>Sélectionnez le poste auquel vous souhaitez candidater.</p>
      </div>
    </div>

  <div th:if="${not #lists.isEmpty(posteapourvoirs)}">
    <ul>
      <li th:each="available : ${posteapourvoirs}">
        <span th:text="${available.poste.numEmploi + ' - ' + available.poste.profil}"></span>
        <form th:unless="${available.candidat}" method="post" th:action="@{/addpostecandidatures}">
          <input type="hidden" name="posteIds" th:value="${available.poste.id}" />
          <button type="submit" class="btn btn-primary">Candidater</button>
        </form>
        <span th:if="${available.candidat}">Candidature enregistrée</span>
        <form th:if="${available.candidat and available.canBeUnsubscribed}" method="post" th:action="@{/addpostecandidatures}">
          <input type="hidden" name="_method" value="DELETE" />
          <input type="hidden" name="posteIds" th:value="${available.poste.id}" />
          <button type="submit" class="btn btn-warning">Annuler la candidature</button>
        </form>
      </li>
    </ul>
  </div>

  <div th:if="${#lists.isEmpty(posteapourvoirs)}" class="alert alert-info">
    <p>Aucun poste disponible pour candidature.</p>
  </div>

    <a th:href="@{/}" class="btn btn-info">Retour</a>
  </div>
</body>
</html>
