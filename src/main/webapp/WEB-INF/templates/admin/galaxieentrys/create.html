<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>Entrées Galaxie - Création</title>
</head>
<body>
  <div layout:fragment="body">
    <h2>Créer Entrées Galaxie</h2>
    
    <form th:action="@{/admin/galaxieentrys}" th:object="${galaxieEntry}" method="post">

      
      <div>
        <label for="numEmploi">Numéro emploi</label>
        <div>
          <input type="text" th:field="*{numEmploi}" id="numEmploi"/>
        </div>
      </div>
      
      <div>
        <label for="numCandidat">Numéro candidat</label>
        <div>
          <input type="text" th:field="*{numCandidat}" id="numCandidat"/>
        </div>
      </div>
      
      <div>
        <label for="civilite">Civilité</label>
        <div>
          <input type="text" th:field="*{civilite}" id="civilite"/>
        </div>
      </div>
      
      <div>
        <label for="nom">Nom</label>
        <div>
          <input type="text" th:field="*{nom}" id="nom"/>
        </div>
      </div>
      
      <div>
        <label for="prenom">Prénom</label>
        <div>
          <input type="text" th:field="*{prenom}" id="prenom"/>
        </div>
      </div>
      
      <div>
        <label for="email">Email</label>
        <div>
          <input type="text" th:field="*{email}" id="email"/>
        </div>
      </div>
      
      <div>
        <label for="candidat">Candidat</label>
        <div>
          <select th:field="*{candidat}" id="candidat">
            <option></option>
            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user}"></option>
          </select>
        </div>
      </div>
      
      <div>
        <label for="poste">Poste</label>
        <div>
          <select th:field="*{poste}" id="poste">
            <option></option>
            <option th:each="poste : ${posteapourvoirs}" th:value="${poste.id}" th:text="${poste}"></option>
          </select>
        </div>
      </div>
      
      <div>
        <label for="localisation">Localisation</label>
        <div>
          <input type="text" th:field="*{localisation}" id="localisation"/>
        </div>
      </div>
      
      <div>
        <label for="profil">Profil</label>
        <div>
          <input type="text" th:field="*{profil}" id="profil"/>
        </div>
      </div>
      
      <div>
        <label for="candidature">Candidature</label>
        <div>
          <select th:field="*{candidature}" id="candidature">
            <option></option>
            <option th:each="cand : ${postecandidatures}" th:value="${cand.id}" th:text="${cand}"></option>
          </select>
        </div>
      </div>
      
      <div>
        <label for="etatDossier">État dossier</label>
        <div>
          <input type="text" th:field="*{etatDossier}" id="etatDossier"/>
        </div>
      </div>
      
      <div>
        <button type="submit" class="btn btn-primary">Créer</button>
        <a th:href="@{/admin/galaxieentrys}" class="btn">Annuler</a>
      </div>
    </form>
  </div>
</body>
</html>
