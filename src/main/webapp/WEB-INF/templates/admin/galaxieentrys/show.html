<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/default}">
<head>
  <title>Entrées Galaxie - Détails</title>
</head>
<body>
  <div layout:fragment="body">
    <h2>Détails Entrées Galaxie</h2>

    <div class="row-fluid">
      <!-- remplacé: Email / Numéro emploi / Numéro candidat -->
      <div class="span4 well">
        <h4>Email</h4>
        <div th:text="${galaxieentry.email}"></div>
      </div>
      <div class="span4 well">
        <h4>Numéro emploi</h4>
        <div th:text="${galaxieentry.numEmploi}"></div>
      </div>
      <div class="span4 well">
        <h4>Numéro candidat</h4>
        <div th:text="${galaxieentry.numCandidat}"></div>
      </div>
    </div>

    <div class="row-fluid">
      <!-- remplacé: Civilité / Nom / Prénom -->
      <div class="span4 well">
        <h4>Civilité</h4>
        <div th:text="${galaxieentry.civilite}"></div>
      </div>
      <div class="span4 well">
        <h4>Nom</h4>
        <div th:text="${galaxieentry.nom}"></div>
      </div>
      <div class="span4 well">
        <h4>Prénom</h4>
        <div th:text="${galaxieentry.prenom}"></div>
      </div>
    </div>

    <div class="row-fluid">
      <!-- remplacé: Localisation / Profil / État dossier -->
      <div class="span4 well">
        <h4>Localisation</h4>
        <div th:text="${galaxieentry.localisation}"></div>
      </div>
      <div class="span4 well">
        <h4>Profil</h4>
        <div th:text="${galaxieentry.profil}"></div>
      </div>
      <div class="span4 well">
        <h4>État dossier</h4>
        <div th:text="${galaxieentry.etatDossier}"></div>
      </div>
    </div>

    <div class="row-fluid">
      <!-- remplacé: Candidat / Poste / Candidature -->
      <div class="span4 well">
        <h4>Candidat</h4>
        <div th:text="${galaxieentry.candidat.emailAddress}"></div>
      </div>
      <div class="span4 well">
        <h4>Poste</h4>
        <div th:text="${galaxieentry.poste.numEmploi}"></div>
      </div>
      <div class="span4 well">
        <h4>Candidature</h4>
        <div>
          <span th:text="${galaxieentry.candidature.candidat.emailAddress}"/>
          [<span th:text="${galaxieentry.candidature.poste.numEmploi}"/>]
      </div>
    </div>

    <hr/>
    <div>
      <a th:href="@{/admin/galaxieentrys}" class="btn btn-default">Retour</a>
      <a th:href="@{/admin/galaxieentrys/{id}(id=${galaxieentry.id},form)}"
         class="btn btn-warning"
         sec:authorize="hasRole('ROLE_ADMIN') or hasRole('ROLE_SUPER_MANAGER')">Modifier</a>
      <a th:if="${galaxieentry.deletable}"
         th:href="@{/admin/galaxieentrys/{id}(id=${galaxieentry.id})}"
         class="btn btn-danger"
         sec:authorize="hasRole('ROLE_ADMIN') or hasRole('ROLE_SUPER_MANAGER')"
         onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet élément ?');">Supprimer</a>
    </div>
  </div>
</body>
</html>
