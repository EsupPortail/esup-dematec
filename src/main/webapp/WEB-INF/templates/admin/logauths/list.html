<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sd="http://www.thymeleaf.org/spring-data"
      layout:decorate="~{layouts/default}">
<head>
  <title>Logs authentification - Liste</title>
</head>
<body>
  <div layout:fragment="body">
    <h2>Logs authentification</h2>

    <!-- Bloc filtre repliable -->
    <div class="accordion help" id="accordionfilter">
      <div class="accordion-group">
        <div class="accordion-heading">
          <a class="accordion-toggle" data-parent="#accordionfilter" data-toggle="collapse" href="#collapseFilter">
            Filtrer
          </a>
        </div>
        <div class="accordion-body collapse"
             th:classappend="${(command.userId != null and command.userId != '') or (command.action != null and command.action != '')} ? 'in' : ''"
             id="collapseFilter">
          <div class="accordion-inner">
            <form th:action="@{/admin/logauths}" method="get" th:object="${command}">
              <div class="row-fluid">
                <div class="span6">
                  <label for="userId">Utilisateur</label>
                  <select size="15" id="userId" th:field="*{userId}" class="input-block-level form-control js-candidat-select">
                    <option th:each="user : ${users}" th:value="${user}" th:text="${user}"></option>
                  </select>
                  <input id="textbox" type="text" placeholder="Filtrer"/>
                </div>
                <div class="span6">
                  <label for="action">Action</label>
                  <select id="action" th:field="*{action}" class="form-control">
                    <option th:each="act : ${actions}" th:value="${act}" th:text="${act}"></option>
                  </select>
                  <input name="sort" type="hidden" value="actionDate,desc"/>
                  <div class="submit">
                    <input class="btn btn-success" value="Trouver" type="submit" id="proceed">
                    <input class="btn reset" value="Effacer" type="reset" id="reset">
                  </div>
                </div>
              </div>
              <script>
                $(document).ready(function() {
                  $('.js-candidat-select').filterByText($('#textbox'), true);
                });
              </script>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${logauths == null or #lists.isEmpty(logauths)}">
      <p>Aucun élément trouvé.</p>
    </div>

    <table th:if="${logauths != null and !#lists.isEmpty(logauths)}" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th><a sd:pagination-sort="actionDate">Date</a></th>
          <th><a sd:pagination-sort="action">Action</a></th>
          <th><a sd:pagination-sort="userId">Utilisateur</a></th>
          <th><a sd:pagination-sort="ip">IP</a></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="log : ${logauths}">
          <td th:text="${#temporals.format(log.actionDate, 'dd/MM/yyyy HH:mm')}"></td>
          <td th:text="${log.action}"></td>
          <td th:text="${log.userId}"></td>
          <td th:text="${log.ip}"></td>
        </tr>
      </tbody>
    </table>

    <div class="pagination-container">
      <div class="pagination-selector btn-group" sd:page-size-selector="dropdown"></div>
      <div class="pagination pagination-centered" sd:pagination="full"></div>
    </div>
  </div>
</body>
</html>
