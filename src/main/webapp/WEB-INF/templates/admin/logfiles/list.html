<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sd="http://www.thymeleaf.org/spring-data"
      layout:decorate="~{layouts/default}">
<head>
  <title>Logs fichiers - Liste</title>
</head>
<body>
  <div layout:fragment="body">
    <h2>Logs fichiers</h2>
    
    <!-- Bloc filtre repliable -->
    <div class="accordion help" id="accordionfilter">
      <div class="accordion-group">
        <div class="accordion-heading">
          <a class="accordion-toggle" data-parent="#accordionfilter" data-toggle="collapse" href="#collapseFilter">
            Filtrer
          </a>
        </div>
        <div class="accordion-body collapse"
             th:classappend="${(command.action != null and command.action != '') or (command.email != null and command.email != '') or (command.nom != null and command.nom != '') or (command.userId != null and command.userId != '')} ? 'in' : ''"
             id="collapseFilter">
          <div class="accordion-inner">
            <form th:action="@{/admin/logfiles}" method="get" th:object="${command}">
              <div class="row-fluid">
                <div class="span3">
                  <label for="action">Action</label>
                  <select id="action" th:field="*{action}" class="form-control">
                    <option th:each="act : ${actions}" th:value="${act}" th:text="${act}"></option>
                  </select>
                </div>
                <div class="span3">
                  <label for="email">Email</label>
                  <select id="email" th:field="*{email}" class="form-control">
                    <option th:each="mail : ${emails}" th:value="${mail}" th:text="${mail}"></option>
                  </select>
                </div>
                <div class="span3">
                  <label for="nom">Nom</label>
                  <select id="nom" th:field="*{nom}" class="form-control">
                    <option th:each="n : ${userNoms}" th:value="${n}" th:text="${n}"></option>
                  </select>
                </div>
                <div class="span3">
                  <label for="userId">Utilisateur</label>
                  <select id="userId" th:field="*{userId}" class="form-control">
                    <option th:each="user : ${users}" th:value="${user}" th:text="${user}"></option>
                  </select>
                </div>
              </div>
              <input name="sort" type="hidden" value="actionDate,desc"/>
              <div class="submit">
                <input class="btn btn-success" value="Trouver" type="submit" id="proceed">
                <input class="btn reset" value="Effacer" type="reset" id="reset">
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${logfiles == null or #lists.isEmpty(logfiles)}">
      <p>Aucun élément trouvé.</p>
    </div>
    
    <table th:if="${logfiles != null and !#lists.isEmpty(logfiles)}" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>Date</th>
          <th>Utilisateur</th>
          <th>IP</th>
          <th>User Agent</th>
          <th>Emploi</th>
          <th>Candidat</th>
          <th>Civilité</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Action</th>
          <th>Fichier</th>
          <th>Taille</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="log : ${logfiles}">
          <td th:text="${#temporals.format(log.actionDate, 'dd/MM/yyyy HH:mm')}"></td>
          <td th:text="${log.userId}"></td>
          <td th:text="${log.ip}"></td>
          <td th:text="${log.userAgent}"></td>
          <td th:text="${log.numEmploi}"></td>
          <td th:text="${log.numCandidat}"></td>
          <td th:text="${log.civilite}"></td>
          <td th:text="${log.nom}"></td>
          <td th:text="${log.email}"></td>
          <td th:text="${log.action}"></td>
          <td th:text="${log.filename}"></td>
          <td th:text="${log.fileSize}"></td>
        </tr>
      </tbody>
    </table>

        <div class="pagination-container">
            <div  class="pagination-selector btn-group" sd:page-size-selector="dropdown"></div>
            <div class="pagination pagination-centered" sd:pagination="full"></div>
        </div>
  </div>
</body>
</html>
