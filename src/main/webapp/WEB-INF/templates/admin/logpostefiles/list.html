<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>Logs fichiers postes - Liste</title>
</head>
<body>
  <div layout:fragment="body">
    <h2>Logs fichiers postes</h2>
    
    <div th:if="${logpostefiles == null or #lists.isEmpty(logpostefiles)}">
      <p>Aucun élément trouvé.</p>
    </div>
    
    <table th:if="${logpostefiles != null and !#lists.isEmpty(logpostefiles)}" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>Date</th>
          <th>Email</th>
          <th>IP</th>
          <th>User Agent</th>
          <th>Emploi</th>
          <th>Action</th>
          <th>Fichier</th>
          <th>Taille</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="log : ${logpostefiles}">
          <td th:text="${log.actionDate}"></td>
          <td th:text="${log.email}"></td>
          <td th:text="${log.ip}"></td>
          <td th:text="${log.userAgent}"></td>
          <td th:text="${log.numEmploi}"></td>
          <td th:text="${log.action}"></td>
          <td th:text="${log.filename}"></td>
          <td th:text="${log.fileSize}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
