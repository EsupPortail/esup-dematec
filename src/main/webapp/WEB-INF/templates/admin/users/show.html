<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/default}">
<head>
  <title>Utilisateur - Détails</title>
</head>
<body>
  <div layout:fragment="body">
    
    <h2>Détails de l'utilisateur</h2>
    
    <div class="row-fluid">
      <div class="span3 well">
        <strong>Email</strong><br/>
        <span th:text="${user.emailAddress}">email@example.com</span>
      </div>
      <div class="span3 well">
        <strong>Status</strong><br/>
        <span th:text="${user.status}">Status</span>
      </div>
      <div class="span3 well">
        <strong>Postes</strong><br/>
        <span th:text="${user.postes}">Postes</span>
      </div>
    </div>
    
    <div class="row-fluid">
      <div class="span3 well">
        <strong>Date d'activation</strong><br/>
        <span th:text="${#dates.format(user.activationDate, 'dd/MM/yyyy HH:mm')}">Date</span>
      </div>
      <div class="span3 well">
        <strong>Clé d'activation</strong><br/>
        <span th:text="${user.activationKey}">Key</span>
      </div>
      <div class="span3 well">
        <strong>Compte activé</strong><br/>
        <span th:if="${user.enabled}" class="label label-success">Oui</span>
        <span th:if="${!user.enabled}" class="label label-important">Non</span>
      </div>
    </div>
    
    <div class="row-fluid">
      <div class="span3 well">
        <strong>Civilité</strong><br/>
        <span th:text="${user.civilite}">Civilité</span>
      </div>
      <div class="span3 well">
        <strong>Nom</strong><br/>
        <span th:text="${user.nom}">Nom</span>
      </div>
      <div class="span3 well">
        <strong>Prénom</strong><br/>
        <span th:text="${user.prenom}">Prénom</span>
      </div>
    </div>
    
    <div class="row-fluid">
      <div class="span3 well">
        <strong>Numéro candidat</strong><br/>
        <span th:text="${user.numCandidat}">NumCandidat</span>
      </div>
      <div class="span3 well">
        <strong>Échecs de connexion</strong><br/>
        <span th:text="${user.loginFailedNb}">0</span>
      </div>
      <div class="span3 well">
        <strong>Heure dernier échec</strong><br/>
        <span th:text="${user.loginFailedTime}">0</span>
      </div>
    </div>
    
    <hr/>
    
    <div>
      <a th:href="@{/admin/users}" class="btn btn-default">Retour à la liste</a>
      <th:block sec:authorize="hasRole('ROLE_ADMIN') or hasRole('ROLE_SUPER_MANAGER')">
        <a th:href="@{/admin/users/{id}(id=${user.id},form)}" class="btn btn-warning">Modifier</a>
        <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post" style="display:inline;">
          <input type="hidden" name="_method" value="delete"/>

          <button type="submit" class="btn btn-danger" onclick="return confirm('Confirmer la suppression ?');">Supprimer</button>
        </form>
      </th:block>
    </div>
    
  </div>
</body>
</html>
