<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/resources/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/bootstrap-responsive.min.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/docs.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/password-strength.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/demat.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/demat-print.css}" media="print"/>
  <link rel="SHORTCUT ICON" th:href="@{/resources/images/favicon.ico}" />

  <title th:text="#{welcome_h3(${application_name})}">Application</title>
</head>

<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <div id="main" class="container-fluid">
    <div layout:fragment="body">
      <!-- Page content will be inserted here -->
    </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- JavaScript -->
  <script defer th:src="@{/resources/js/password-strength.js}"></script>
  <script defer th:src="@{/resources/js/select-filter.js}"></script>
  <script defer th:src="@{/resources/js/dialogs-and-accordions.js}"></script>
  <script defer th:src="@{/resources/js/demat.js}"></script>
</body>
</html>
