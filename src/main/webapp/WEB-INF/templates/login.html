<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public}">
<head>
  <meta charset="UTF-8" />
  <title th:text="#{security_login_title}">Login</title>
</head>
<body>
  <div layout:fragment="body" class="container-fluid">
    <div class="row-fluid">
      <div class="span6 well" th:utext="${textePremierePageAnonyme}"></div>
      <div class="span6 well">
        <div th:if="${param.error != null}">
          <div class="errors">
            <h4 class="form-signin-heading alert alert-danger" th:text="${SPRING_SECURITY_LAST_EXCEPTION.message}"></h4>
            <div id="exceptionModal" class="modal hide fade" tabindex="-1" role="dialog" aria-labelledby="Échec de l'authentification" aria-hidden="true">
              <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">Fermer</button>
              </div>
              <div class="modal-body form-signin-heading alert alert-danger">
                <h4 th:text="${SPRING_SECURITY_LAST_EXCEPTION.message}"></h4>
              </div>
            </div>
            <script type="text/javascript">
              $(window).load(function(){
                $('#exceptionModal').modal('show');
              });
            </script>
          </div>
        </div>
        <div th:if="${param.login_error == null}">
          <h4 class="form-signin-heading" th:text="#{security_login_message}"></h4>
        </div>

        <form th:action="@{/login}" method="POST" name="f">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div>
            <input id="j_username" name="username" type="text" class="input-block-level" th:placeholder="#{security_login_form_name}" />
          </div>
          <br />
          <div>
            <input id="j_password" name="password" type="password" class="input-block-level" th:placeholder="#{security_login_form_password}" />
          </div>
          <br />
          <div>
            <input id="proceed" type="submit" value="Valider" class="btn btn-large btn-success" />
            <input id="reset" type="reset" th:value="#{button_reset}" class="btn btn-info" />
            <a th:href="@{/forgotpassword/index}" class="btn btn-warning">Mot de passe oublié</a>
            <a th:if="${candidatCanSignup}" th:href="@{/signup}" class="btn">Créer un compte</a>
          </div>
          <div></div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
