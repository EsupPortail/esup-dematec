<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <meta charset="UTF-8" />
  <title>Poste à Pourvoir</title>
</head>
<body>
<div layout:fragment="body">
  <!-- Détermination des droits de gestion -->
      <th:block th:with="canManage=${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_SUPER_MANAGER'')')}">

        <!-- Affichage des champs du poste -->
        <div class="field">
          <label>Emploi :</label>
          <span th:text="${posteapourvoir.numEmploi}"></span>
        </div>

        <div class="field" th:if="${canManage}">
          <label>Profil :</label>
          <span th:text="${posteapourvoir.profil}"></span>
        </div>

        <div class="field" th:if="${canManage}">
          <label>Localisation :</label>
          <span th:text="${posteapourvoir.localisation}"></span>
        </div>

        <div class="field">
          <label>Membres :</label>
          <span>
            <th:block th:each="membre, iter : ${posteapourvoir.membres}">
              <th:block th:text="${membre.emailAddress}"/><th:block th:text="${iter.last ? '' : ', '}"/>
            </th:block>
          </span>
        </div>

        <div class="field" th:if="${candidatCanSignup and canManage}">
          <label>Date de fin d'inscription candidat :</label>
          <span th:text="${#dates.format(posteapourvoir.dateEndSignupCandidat, posteAPourvoir_dateendsignupcandidat_date_format)}"></span>
        </div>

        <div class="field" th:if="${canManage}">
          <label>Date de fin candidat auditionnable :</label>
          <span th:text="${#dates.format(posteapourvoir.dateEndCandidatAuditionnable, posteAPourvoir_dateendcandidatauditionnable_date_format)}"></span>
        </div>

        <div class="field">
          <label>Présidents :</label>
          <th:block th:each="president, iter : ${posteapourvoir.presidents}">
            <th:block th:text="${president.emailAddress}"/><th:block th:text="${iter.last ? '' : ', '}"/>
          </th:block>
        </div>

        <div class="row-fluid" th:if="${canManage}">
          <div class="quicklinks span12">
            <a class="btn btn-warning" title="Modifier Poste"
               th:href="@{/posteapourvoirs/{id}(id=${posteapourvoir.id},form)}">Modifier Poste</a>
            </span>
          </div>
        </div>

      </th:block>

  <hr/>

  <!-- Détermination des droits de gestion du poste -->
  <th:block th:with="manageposte=${isPresident}">
    <sec:authorize access="hasRole('ROLE_ADMIN') or hasRole('ROLE_MANAGER')">
      <th:block th:with="manageposte=${true}">

        <div class="well">
          <h4>Fichiers internes au poste / comité de sélection :</h4>

          <table class="table table-bordered table-striped" th:if="${not #lists.isEmpty(posteapourvoir.posteFiles)}">
            <thead>
            <tr>
              <th>Fichier</th>
              <th>Taille</th>
              <th>Date d'envoi</th>
              <th>Émetteur</th>
              <th th:if="${manageposte}">Suppression</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="posteFile : ${posteapourvoir.posteFiles}">
              <td>
                <h4>
                  <a th:href="@{/posteapourvoirs/{id}/{fileId}(id=${posteapourvoir.id}, fileId=${posteFile.id})}"
                     th:text="${posteFile.filename}"></a>
                </h4>
              </td>
              <td th:text="${posteFile.fileSizeFormatted}"></td>
              <td th:text="${posteFile.sendTime}"></td>
              <td th:text="${posteFile.sender.emailAddress}"></td>
              <td th:if="${manageposte}">
                <a class="btn btn-danger"
                   th:href="@{/posteapourvoirs/{id}/delFile/{fileId}(id=${posteapourvoir.id}, fileId=${posteFile.id})}"
                   th:onclick="'return confirm(\'' + #{entity_delete_confirm} + '\');'">
                  <i class="icon-trash"><!--  --></i>Supprimer
                </a>
              </td>
            </tr>
            </tbody>
            <tfoot>
            <tr class="footer">
              <td th:colspan="${manageposte ? 5 : 4}">
                <a class="btn" th:href="@{/posteapourvoirs/{id}(id=${posteapourvoir.id}, export='zip')}">Export zip</a>
                <span th:if="${exportFailed != null}" class="alert alert-error">
                                        - Export <b th:text="${exportFailed[0]}"></b> impossible pour cette candidature.
                                    </span>
              </td>
            </tr>
            </tfoot>
          </table>

          <div th:if="${manageposte}">
            <form th:action="@{/posteapourvoirs/{id}/addFile(id=${posteapourvoir.id})}"
                  method="post"
                  enctype="multipart/form-data">
              <fieldset>
                <input id="fc_fr_univrouen_poste_domain_PosteAPourvoirFile_file"
                       name="file"
                       required="required"
                       type="file"/>
              </fieldset>
              <button type="submit" class="btn btn-success">Envoyer</button>
            </form>
          </div>
        </div>

      </th:block>
    </sec:authorize>
  </th:block>

  <hr/>

  <a th:href="@{/postecandidatures(numEmploiPostes=${posteapourvoir.numEmploi}, _numEmploiPostes=${posteapourvoir.id})}"
     class="btn btn-success btn-large">Candidatures</a>

</div>
</body>
</html>
