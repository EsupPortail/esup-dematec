# Configuration pour les tests
# Ce fichier surcharge les propriétés de src/main pour les tests

# Base de données PostgreSQL via Testcontainers
# Les propriétés database.* ci-dessous sont surchargées dynamiquement par AbstractDatabaseTest
# qui démarre un conteneur PostgreSQL via Testcontainers
# Valeurs par défaut (remplacées au runtime):
database.driverClassName=org.postgresql.Driver
database.url=jdbc:postgresql://localhost:5432/esup_test
database.username=test
database.password=test

# Configuration JPA/Hibernate pour les tests
# Utilise create-drop pour repartir d'une base vide à chaque exécution de tests
database.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
database.hibernate.hbm2ddl.auto=create-drop
database.hibernate.ejb.naming_strategy=org.hibernate.cfg.ImprovedNamingStrategy
database.hibernate.show_sql=false
database.hibernate.format_sql=false

# Désactiver certaines fonctionnalités pour les tests
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.test.database.replace=none

# Configuration email pour les tests (désactivé)
email.enabled=false

# Configuration sécurité pour les tests
security.rememberMe.key=testRememberMeKey


